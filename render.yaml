# Render Blueprint specification for AICMS
# Docs: https://render.com/docs/blueprint-spec
services:
  # 1. Backend Web Service (Node.js + Express + Socket.IO)
  - type: web
    name: aicms-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: aicms-frontend
          property: host

  # 2. Frontend Static Site (React 18 SPA)
  - type: web
    name: aicms-frontend
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: aicms-backend
          property: host
          value: https://${host}/api
      - key: REACT_APP_SOCKET_URL
        fromService:
          type: web
          name: aicms-backend
          property: host
          value: https://${host}

